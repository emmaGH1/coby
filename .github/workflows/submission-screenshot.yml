name: Android submission screenshot

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_COBY_AI_PROVIDER: fixture
      EXPO_PUBLIC_COBY_AI_MODEL: gemini-3.5-flash-lite
      EXPO_PUBLIC_COBY_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Compile fixture-only release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 scripts/capture_android.py
            python3 scripts/capture_native_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coby-android-screenshot
          path: artifacts/screenshot-home.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coby-native-flow-evidence
          path: |
            artifacts/flow-*.png
            artifacts/flow-failure.xml
            artifacts/native-flow.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: coby-offline-fixture-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
