name: Android submission screenshot

on:
  workflow_dispatch:
    inputs:
      reuse_apk_run:
        description: 'Optional fixture APK run ID; only reusable when runtime files are unchanged'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_COBY_AI_PROVIDER: fixture
      EXPO_PUBLIC_COBY_AI_MODEL: gemini-3.5-flash-lite
      EXPO_PUBLIC_COBY_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.reuse_apk_run == ''
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: inputs.reuse_apk_run == ''
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
        if: inputs.reuse_apk_run == ''
      - run: npx expo prebuild --platform android --non-interactive --no-install
        if: inputs.reuse_apk_run == ''
      - name: Compile fixture-only release APK
        if: inputs.reuse_apk_run == ''
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Reuse unchanged fixture runtime
        if: inputs.reuse_apk_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.reuse_apk_run }}
        run: |
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          built_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" --jq .head_sha)
          test -z "$(git diff --name-only "$built_sha" HEAD -- App.tsx index.ts src app.json package.json package-lock.json assets)"
          gh run download "$APK_RUN_ID" --name coby-offline-fixture-apk --dir android/app/build/outputs/apk/release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 scripts/capture_android.py
            python3 scripts/capture_native_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coby-android-screenshot
          path: artifacts/screenshot-home.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coby-native-flow-evidence
          path: |
            artifacts/flow-*.png
            artifacts/flow-failure.xml
            artifacts/native-flow.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coby-offline-fixture-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
